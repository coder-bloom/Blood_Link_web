<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Settings - BloodLink</title>
  <link rel="stylesheet" href="./Stylesheets/userdashboard.css" />
  <link rel="stylesheet" href="./Stylesheets/usersettings.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <img src="./images/blood drop.png" alt="Logo">
      <h2><span>BLOOD</span>LINK</h2>
    </div>

   <nav class="nav-menu">
      <a href="./userdashboard.html" >🏠 Dashboard</a>
      <a href="./request.html">🩸 Request Blood</a>
      <a href="./donate.html">❤️ Donate Blood</a>
      <a href="./userrequests.html">📋 My Requests</a>
      <a href="./usersettings.html" class="active">⚙️ Settings</a>
      <a href="#" onclick="logout()">🚪 Logout</a>
    </nav>

    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <section class="settings-section">
      <h1>⚙️ Account Settings</h1>
      <p>Manage your profile details and account preferences.</p>

      <!-- Profile Form -->
      <form class="settings-form">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" value="Varsha Rani" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" value="varsha@example.com" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" value="+91 9876543210" required />
        </div>

        <div class="form-group">
          <label for="bloodgroup">Blood Group</label>
          <select id="bloodgroup" required>
            <option>-- Select --</option>
            <option selected>O+</option>
            <option>O−</option>
            <option>A+</option>
            <option>A−</option>
            <option>B+</option>
            <option>B−</option>
            <option>AB+</option>
            <option>AB−</option>
          </select>
        </div>

        <hr />

        <div class="form-group">
          <label for="password">Change Password</label>
          <input type="password" id="password" placeholder="Enter new password" />
        </div>

        <button type="submit" class="btn">💾 Save Changes</button>
      </form>
    </section>
  </main>

  <script src="./Scripts/donate.js"></script>
</body>
</html>
