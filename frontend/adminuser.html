<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
  <title>Manage Users | BloodLink Admin</title>
  <link rel="stylesheet" href="./Stylesheets/admindashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    .delete-btn {
      background-color: #e63946;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .delete-btn:hover {
      background-color: #c9184a;
    }
    .loading {
      text-align: center;
      color: gray;
      margin-top: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f4f4f4;
    }
  </style>
</head>

<body>
  <div class="admin-container">
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <h2>🩸 BloodLink</h2>
      </div>
     <nav class="nav-menu">
        <a href="./admindashboard.html" class="nav-item"><i class="fa fa-home"></i> Dashboard</a>
        <a href="./adminuser.html" class="nav-item active"><i class="fa fa-users"></i> Manage Users</a>
        <a href="./adminrequests.html" class="nav-item"><i class="fa fa-tint"></i> Blood Requests</a>
        <a href="./adminhospital.html" class="nav-item"><i class="fa fa-hospital"></i> Hospitals</a>
        <a href="./adminreports.html" class="nav-item"><i class="fa fa-chart-bar"></i> Reports</a>
      </nav>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </aside>
  
    <main class="main-content">
      <header>
        <button class="menu-toggle" id="menuToggle"><i class="fa fa-bars"></i></button>
        <h1>Manage Users</h1>
      </header>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr><td colspan="4" class="loading">Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    async function fetchUsers() {
      try {
        const response = await fetch("http://localhost:5000/api/users");
        if (!response.ok) throw new Error("Failed to fetch users");

        const users = await response.json();
        const tbody = document.getElementById("userTableBody");
        tbody.innerHTML = ""; // clear loading message

        if (!users || users.length === 0) {
          tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>No users found.</td></tr>";
          return;
        }

        users.forEach(user => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${user.name || "N/A"}</td>
            <td>${user.email || "N/A"}</td>
            <td>${user.role || "user"}</td>
            <td><button class="delete-btn" onclick="deleteUser('${user._id}')">Delete</button></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        console.error("Error fetching users:", error);
        document.getElementById("userTableBody").innerHTML =
          "<tr><td colspan='4' style='text-align:center;color:red;'>Error loading users.</td></tr>";
      }
    }

    async function deleteUser(userId) {
      if (!confirm("Are you sure you want to delete this user?")) return;

      try {
        const res = await fetch(`http://localhost:5000/api/users/${userId}`, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" }
        });

        if (res.ok) {
          alert("User deleted successfully!");
          fetchUsers(); // refresh user list
        } else {
          const data = await res.json();
          alert(data.message || "Failed to delete user.");
        }
      } catch (err) {
        console.error("Error deleting user:", err);
        alert("Server error while deleting user.");
      }
    }

    function logout() {
      alert("Logged out successfully!");
      window.location.href = "index.html";
    }

    // Initial load
    fetchUsers();
  </script>
</body>
</html>
