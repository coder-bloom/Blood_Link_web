<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Blood - BloodLink</title>
  <link rel="stylesheet" href="./Stylesheets/request.css" />
  <link rel="stylesheet" href="./Stylesheets/index.css">
  <link rel="stylesheet" href="./Stylesheets/userdashboard.css">
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <img src="./images/blood drop.png"alt="Logo">
      <h2><span>BLOOD</span>LINK</h2>
    </div>

   <nav class="nav-menu">
      <a href="./userdashboard.html" >🏠 Dashboard</a>
      <a href="./request.html" class="active">🩸 Request Blood</a>
      <a href="./donate.html">❤️ Donate Blood</a>
      <a href="./userrequests.html">📋 My Requests</a>
      <a href="./usersettings.html">⚙️ Settings</a>
      <a href="#" onclick="logout()">🚪 Logout</a>
    </nav>

    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  </aside>

  

  <!-- Donate Blood Section -->
<section class="request-section">
  <h1>Donate Blood</h1>
  <p>Please fill in the details below to record your blood donation.</p>

  <form class="request-form">
    <div class="form-group">
      <label for="donorname">Donor Name</label>
      <input type="text" id="donorname" placeholder="Enter donor name" required />
    </div>

    <div class="form-group">
      <label for="bloodgroup">Blood Group</label>
      <select id="bloodgroup" required>
        <option value="">-- Select Blood Group --</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
      </select>
    </div>

    <div class="form-group">
      <label for="donationtype">Donation Type</label>
      <select id="donationtype" required>
        <option value="">-- Select Donation Type --</option>
        <option value="Whole Blood">Whole Blood</option>
        <option value="Platelets">Platelets</option>
        <option value="Plasma">Plasma</option>
      </select>
    </div>

    <div class="form-group">
      <label for="quantity">Quantity Collected (ml)</label>
      <input type="number" id="quantity" placeholder="Enter quantity (e.g. 450)" required />
    </div>

    <div class="form-group">
      <label for="hospital">Blood Bank / Hospital</label>
      <input type="text" id="hospital" placeholder="Enter blood bank or hospital name" required />
    </div>

    <div class="form-group">
      <label for="unitid">Bag / Unit Number</label>
      <input type="text" id="unitid" placeholder="Enter blood bag number" required />
    </div>

    <div class="form-group">
      <label for="message">Remarks</label>
      <textarea id="message" rows="4" placeholder="Any notes or observations"></textarea>
    </div>

    <button type="submit" class="btn">Submit Donation</button>
  </form>
</section>



  <script src="./Scripts/donaterequest.js "></script>
</body>
</html>
