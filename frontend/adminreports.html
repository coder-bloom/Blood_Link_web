<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | BloodLink Admin</title>
  <link rel="stylesheet" href="./Stylesheets/admindashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .stat-card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .stat-card h2 {
      margin: 10px 0;
      color: #d9534f;
    }
    canvas {
      margin-top: 40px;
      max-width: 700px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <h2>🩸 BloodLink</h2>
      </div>

      <nav class="nav-menu">
        <a href="./admindashboard.html" class="nav-item"><i class="fa fa-home"></i> Dashboard</a>
        <a href="./adminuser.html" class="nav-item"><i class="fa fa-users"></i> Manage Users</a>
        <a href="./adminrequests.html" class="nav-item"><i class="fa fa-tint"></i> Blood Requests</a>
        <a href="./adminhospital.html" class="nav-item"><i class="fa fa-hospital"></i> Hospitals</a>
        <a href="./adminreports.html active" class="nav-item active"><i class="fa fa-chart-bar"></i> Reports</a>
      </nav>

      <button class="logout-btn" onclick="logout()">Logout</button>
    </aside>

    <main class="main-content">
      <header>
        <button class="menu-toggle" id="menuToggle"><i class="fa fa-bars"></i></button>
        <h1>Reports & Statistics</h1>
      </header>

      <div class="stats-container" id="statsContainer">
        <div class="stat-card"><h3>Total Users</h3><h2 id="totalUsers">--</h2></div>
        <div class="stat-card"><h3>Total Requests</h3><h2 id="totalRequests">--</h2></div>
        <div class="stat-card"><h3>Approved</h3><h2 id="approvedRequests">--</h2></div>
        <div class="stat-card"><h3>Pending</h3><h2 id="pendingRequests">--</h2></div>
        <div class="stat-card"><h3>Rejected</h3><h2 id="rejectedRequests">--</h2></div>
      </div>

      <canvas id="requestsChart"></canvas>
    </main>
  </div>

  <script>
  const API_URL = "http://localhost:5000/api/reports";

  document.addEventListener("DOMContentLoaded", async () => {
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error("Failed to fetch stats");
      const data = await res.json();

      document.getElementById("totalUsers").textContent = data.totalUsers;
      document.getElementById("totalRequests").textContent = data.totalRequests;
      document.getElementById("approvedRequests").textContent = data.approvedRequests;
      document.getElementById("pendingRequests").textContent = data.pendingRequests;
      document.getElementById("rejectedRequests").textContent = data.rejectedRequests;

      // Chart.js visualization
      const ctx = document.getElementById("requestsChart").getContext("2d");
      new Chart(ctx, {
        type: "doughnut",
        data: {
          labels: ["Approved", "Pending", "Rejected"],
          datasets: [{
            data: [data.approvedRequests, data.pendingRequests, data.rejectedRequests],
            backgroundColor: ["#28a745", "#ffc107", "#dc3545"]
          }]
        },
        options: {
          plugins: {
            legend: { position: "bottom" },
            title: { display: true, text: "Blood Request Status Distribution" }
          }
        }
      });
    } catch (err) {
      console.error("Error loading reports:", err);
      document.getElementById("statsContainer").innerHTML = `<p>Error loading report data.</p>`;
    }
  });

  function logout() {
    localStorage.removeItem("adminToken");
    window.location.href = "./login.html";
  }
  </script>
</body>
</html>
